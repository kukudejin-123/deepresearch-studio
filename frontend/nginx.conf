# DeepResearch Studio 前端 Nginx 配置
#
# 同源部署模式：静态文件 + 反向代理都在 80 端口，浏览器只与一个源交互，
# 无需处理 CORS，也不必暴露后端端口。后端地址使用 compose 服务名
# （Docker 内建 DNS 解析）：api / worker 服务名为 "api"。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端资源：长缓存（Vite 产物带内容哈希）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退：任何未命中路径都交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理（关闭缓冲，保证 SSE / 流式响应实时下发）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Prometheus 指标端点
    location /metrics {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # WebSocket 反向代理（执行事件实时推送）
    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 深度研究任务可能执行较久，读超时放宽
        proxy_read_timeout 3600s;
    }
}
