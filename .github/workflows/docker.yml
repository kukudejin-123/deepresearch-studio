name: Docker

# 镜像构建与推送（第三期部署交付）
#
# 触发：推送到 main / 打 tag / 手动触发。
# 产物：ghcr.io/<owner>/<repo>-api 与 -frontend，多阶段构建，推送前先本地构建验证。

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 仓库名转小写（GHCR 要求镜像名全小写）
      - name: Compute image names
        id: meta
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "api=${REGISTRY}/${REPO_LC}-api" >> "$GITHUB_OUTPUT"
          echo "frontend=${REGISTRY}/${REPO_LC}-frontend" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.api }}:latest
            ${{ steps.meta.outputs.api }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend }}:latest
            ${{ steps.meta.outputs.frontend }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### 镜像已推送"
            echo "- \`${{ steps.meta.outputs.api }}:latest\`"
            echo "- \`${{ steps.meta.outputs.frontend }}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
